name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Download bundled Chromium
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\browsers | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = "$pwd\build\browsers"
          python -m playwright install chromium

      - name: Build application
        shell: cmd
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --windowed
          --name KejynStingerExporter
          --distpath dist
          --workpath build\pyinstaller
          --specpath build
          --collect-all playwright
          --collect-all imageio_ffmpeg
          app\KejynStingerExporter.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Setup.exe
        shell: cmd
        run: |
          if not exist release mkdir release
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\KejynStingerExporter.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KejynStingerExporter-Windows
          path: release\KejynStingerExporter-Setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release\KejynStingerExporter-Setup-*.exe
          generate_release_notes: true
